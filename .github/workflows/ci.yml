name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================================================
  # 코드 품질 검사
  # ============================================================================
  lint:
    name: 코드 품질 검사
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 린터 설치
        run: |
          pip install flake8 black isort

      - name: Flake8 검사
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Black 포맷 검사
        run: |
          black --check --diff src/ || echo "포맷 권장사항 있음 (필수 아님)"

  # ============================================================================
  # 테스트
  # ============================================================================
  test:
    name: 테스트 실행
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 기본 의존성 설치
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install pyyaml python-dotenv pydantic
          pip install numpy

      - name: 테스트 의존성 설치
        run: |
          # 핵심 모듈만 설치 (torch 제외)
          pip install gradio fastapi uvicorn httpx
          pip install sqlalchemy chromadb
          pip install prometheus-client slowapi

      - name: 테스트 실행
        run: |
          pytest tests/ -v --tb=short --no-cov \
            --ignore=tests/test_integration.py \
            --ignore=tests/test_api.py \
            -k "not slow and not integration"
        continue-on-error: true

      - name: 안전 시스템 테스트
        run: |
          pytest tests/test_safety.py tests/test_safety_critical.py -v --tb=short --no-cov
        continue-on-error: true

  # ============================================================================
  # 보안 검사
  # ============================================================================
  security:
    name: 보안 검사
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 보안 도구 설치
        run: |
          pip install bandit safety

      - name: Bandit 보안 검사
        run: |
          bandit -r src/ -ll -ii --skip B101,B104,B608 || echo "보안 권장사항 확인 필요"

      - name: 의존성 취약점 검사
        run: |
          pip install -r requirements.txt --dry-run 2>&1 | head -50 || true
        continue-on-error: true

  # ============================================================================
  # 빌드 검증
  # ============================================================================
  build:
    name: 빌드 검증
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 모듈 임포트 검증
        run: |
          pip install pyyaml python-dotenv pydantic numpy
          python -c "
          import sys
          sys.path.insert(0, '.')

          # 핵심 모듈 임포트 테스트
          from src.emotion_analyzer_v2 import KoreanEmotionAnalyzer
          from src.safety_system_v2 import SafetySystem, RiskLevel
          from src.prompts_enhanced import EnhancedPromptTemplate
          from src.session_storage import SessionStorage

          print('✅ 핵심 모듈 임포트 성공')

          # 인스턴스 생성 테스트
          analyzer = KoreanEmotionAnalyzer()
          safety = SafetySystem()

          print('✅ 인스턴스 생성 성공')
          "

      - name: 설정 파일 검증
        run: |
          python -c "
          import yaml
          with open('configs/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          print('✅ config.yaml 유효함')
          print(f'  - 모델: {config.get(\"model\", {}).get(\"name\", \"N/A\")}')
          print(f'  - Provider: {config.get(\"model\", {}).get(\"provider\", \"N/A\")}')
          "

  # ============================================================================
  # Docker 빌드 (선택적)
  # ============================================================================
  docker:
    name: Docker 빌드
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile 검증
        run: |
          if [ -f Dockerfile ]; then
            echo "✅ Dockerfile 존재"
            head -20 Dockerfile
          else
            echo "⚠️ Dockerfile 없음 (선택적)"
          fi

  # ============================================================================
  # 문서 생성
  # ============================================================================
  docs:
    name: 문서 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: README 검증
        run: |
          if [ -f README.md ]; then
            echo "✅ README.md 존재"
            wc -l README.md
          else
            echo "❌ README.md 없음"
            exit 1
          fi

      - name: API 문서 확인
        run: |
          # FastAPI 문서 엔드포인트 확인
          grep -r "docs_url\|redoc_url" src/api.py && echo "✅ API 문서 설정됨" || echo "⚠️ API 문서 확인 필요"

  # ============================================================================
  # 알림 (선택적)
  # ============================================================================
  notify:
    name: 결과 알림
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
      - name: 결과 요약
        run: |
          echo "## CI/CD 파이프라인 결과"
          echo ""
          echo "| 단계 | 상태 |"
          echo "|------|------|"
          echo "| 린트 | ${{ needs.lint.result }} |"
          echo "| 테스트 | ${{ needs.test.result }} |"
          echo "| 보안 | ${{ needs.security.result }} |"
          echo "| 빌드 | ${{ needs.build.result }} |"
