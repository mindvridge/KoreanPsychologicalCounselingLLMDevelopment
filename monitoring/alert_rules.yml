# Alert Rules for Korean Mental Health Counseling System
groups:
  - name: mental_health_alerts
    rules:
      # High Response Time Alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(api_response_time_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is above 3 seconds for 2 minutes"

      # Crisis Detection Alert
      - alert: CrisisDetected
        expr: increase(crisis_detections_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Crisis situation detected"
          description: "A crisis situation was detected in a conversation. Immediate review may be needed."

      # High Error Rate Alert
      - alert: HighErrorRate
        expr: rate(api_requests_total{status="error"}[5m]) / rate(api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "Error rate is above 5% for the last 5 minutes"

      # Service Down Alert
      - alert: ServiceDown
        expr: up{job="mental_health_api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mental Health API is down"
          description: "The mental health counseling API has been down for more than 1 minute"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 / 1024 > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "API process is using more than 8GB of memory"

      # Too Many Concurrent Sessions
      - alert: HighConcurrentSessions
        expr: active_sessions > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of concurrent sessions"
          description: "More than 100 concurrent sessions active"

      # Voice Service Errors
      - alert: VoiceServiceErrors
        expr: increase(api_requests_total{endpoint=~"/voice/.*", status="error"}[10m]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple voice service errors"
          description: "More than 10 voice service errors in the last 10 minutes"

      # Export Service Errors
      - alert: ExportServiceErrors
        expr: increase(api_requests_total{endpoint=~"/export/.*", status="error"}[10m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Export service errors"
          description: "Multiple export service errors detected"
