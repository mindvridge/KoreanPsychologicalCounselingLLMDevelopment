version: '3.8'

services:
  # ============================================================================
  # Main Mental Health LLM Service
  # ============================================================================
  mental-health-llm:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: korean-mental-health-llm:latest
    container_name: mental-health-llm

    # GPU runtime for CUDA support
    runtime: nvidia

    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production

    ports:
      - "7860:7860"  # Gradio web interface
      - "8000:8000"  # FastAPI REST API

    volumes:
      # Model cache (persistent across restarts)
      - model_cache:/app/models
      # Conversation logs (encrypted)
      - conversation_logs:/app/logs
      # Data directory
      - data_volume:/app/data
      # Backup directory
      - backup_volume:/app/backups
      # Configuration
      - ./configs:/app/configs:ro

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Resource limits (adjust based on your hardware)
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 64G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    networks:
      - mental-health-network

    depends_on:
      - redis
      - postgres

  # ============================================================================
  # Redis for caching and session management
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: mental-health-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - mental-health-network

  # ============================================================================
  # PostgreSQL for conversation history and metrics
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mental-health-postgres

    environment:
      - POSTGRES_DB=mental_health_db
      - POSTGRES_USER=llmuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmuser -d mental_health_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - mental-health-network

  # ============================================================================
  # Prometheus for metrics collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mental-health-prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

    networks:
      - mental-health-network

    depends_on:
      - mental-health-llm

  # ============================================================================
  # Grafana for visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: mental-health-grafana

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    restart: unless-stopped

    networks:
      - mental-health-network

    depends_on:
      - prometheus

  # ============================================================================
  # Nginx reverse proxy (optional, for production SSL termination)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: mental-health-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    restart: unless-stopped

    networks:
      - mental-health-network

    depends_on:
      - mental-health-llm

    profiles:
      - with-nginx

# ============================================================================
# Volumes
# ============================================================================
volumes:
  model_cache:
    driver: local
  conversation_logs:
    driver: local
  data_volume:
    driver: local
  backup_volume:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  mental-health-network:
    driver: bridge

# ============================================================================
# Usage:
#
# Start all services:
#   docker-compose up -d
#
# Start with nginx:
#   docker-compose --profile with-nginx up -d
#
# View logs:
#   docker-compose logs -f mental-health-llm
#
# Stop all services:
#   docker-compose down
#
# Stop and remove volumes (careful!):
#   docker-compose down -v
#
# Rebuild and restart:
#   docker-compose up -d --build
#
# Scale (if supported):
#   docker-compose up -d --scale mental-health-llm=2
# ============================================================================
