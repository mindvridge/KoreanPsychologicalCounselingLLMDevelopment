# =============================================================================
# A100 80GB 단일 GPU 프로덕션 설정
# =============================================================================
# 하드웨어: 1x A100 80GB PCIe / 16vCore / 192GB RAM
# LLM: Qwen2.5-32B-Instruct (FP16)
# 동시 사용자: 1-2명 / 시간당 상담: ~800회
# =============================================================================

# Model Configuration
model:
  name: "Qwen/Qwen2.5-32B-Instruct"
  quantization: "none"  # FP16 전체 정밀도
  torch_dtype: "float16"
  max_memory: "65GB"
  device_map: "auto"

  # 추론 최적화
  use_flash_attention_2: true
  attn_implementation: "flash_attention_2"

  generation:
    max_length: 512
    min_length: 50
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.1
    do_sample: true
    num_beams: 1  # greedy with sampling

# Safety and Crisis Detection
safety:
  crisis_detection_threshold: 0.7
  auto_alert_professionals: true
  log_all_conversations: true
  emergency_contacts:
    suicide_hotline: "1393"
    mental_health_hotline: "1577-0199"

# RAG System
rag:
  knowledge_base_dir: "./knowledge_base"
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "jhgan/ko-sroberta-multitask"
  max_results: 5

# Monitoring
monitoring:
  enabled: true
  retention_days: 90
  prometheus_enabled: true
  prometheus_port: 9090

# Logging (PIPA Compliant)
logging:
  log_dir: "./logs"
  retention_days: 90
  enable_encryption: true
  mask_pii: true
  log_level: "INFO"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  rate_limit: 100
  timeout: 60
  workers: 4

# =================================
# Enhanced Features
# =================================

validation:
  enabled: true
  min_empathy_score: 0.5
  require_safety_check: true
  max_repetition_ratio: 0.3
  regenerate_on_failure: true
  max_regeneration_attempts: 2

conversation_state:
  enabled: true
  auto_phase_progression: true
  track_emotions: true
  identify_concerns: true
  max_history_length: 20

enhanced_rag:
  enabled: true
  query_expansion: true
  relevance_threshold: 0.5
  max_context_length: 2000
  reranking_enabled: true

evaluation:
  enabled: true
  metrics:
    empathy: 0.30
    safety: 0.25
    therapeutic: 0.20
    cultural: 0.15
    coherence: 0.10
  min_passing_score: 0.6

experiments:
  enabled: true
  default_sample_size: 1000
  significance_level: 0.05

dashboard:
  enabled: true
  update_interval_seconds: 30
  history_retention_hours: 168
  alert_cooldown_minutes: 5

finetuning:
  method: "qlora"
  output_dir: "./outputs/finetuned_model"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  training:
    epochs: 3
    batch_size: 4
    learning_rate: 0.0002
    gradient_accumulation_steps: 4
    warmup_ratio: 0.03

# =================================
# 음성 상담 설정 (Voice Counseling)
# =================================

stt:
  enabled: true
  model: "large-v3"
  device: "cuda"
  compute_type: "float16"
  language: "ko"
  use_faster_whisper: true
  vad:
    enabled: true
    aggressiveness: 3
    frame_duration_ms: 30
    min_speech_duration_ms: 250
    max_speech_duration_s: 30

tts:
  enabled: true
  model: "Zyphra/Zonos-v0.1-transformer"
  device: "cuda"
  default_voice_profile: "korean_counselor"
  output_sample_rate: 44100
  counselor_voice:
    speaking_rate: 0.9
    pitch: -2.0
    default_emotion: "calm"
    emotion_intensity: 0.6

voice_cloning:
  enabled: true
  reference_audio_dir: "./voice_profiles"
  min_reference_duration: 5
  max_reference_duration: 30

voice_streaming:
  enabled: true
  chunk_duration: 2.0
  sample_rate: 16000
  channels: 1
  websocket_timeout: 300
  buffer_size: 4096

voice_api:
  host: "0.0.0.0"
  port: 8001
  cors_origins: ["*"]
  max_audio_size_mb: 50

# =================================
# 배치 처리 설정 (A100 80GB 최적화)
# =================================

batch_processing:
  enabled: true
  strategy: "adaptive"

  min_batch_size: 1
  max_batch_size: 4  # 80GB에서 안정적
  max_wait_time_ms: 300

  adaptive:
    target_latency_ms: 2500
    adjustment_interval: 10
    latency_history_size: 100

  priority_max_batch:
    crisis: 1
    realtime: 1
    premium: 2
    standard: 4
    background: 8

  priority_max_wait:
    crisis: 0
    realtime: 50
    premium: 150
    standard: 300
    background: 1000

  crisis_keywords:
    - "자살"
    - "죽고 싶"
    - "죽을"
    - "목숨"
    - "끝내고 싶"
    - "자해"
    - "손목"
    - "뛰어내리"
    - "살고 싶지 않"
    - "사라지고 싶"
    - "없어지고 싶"
    - "힘들어서 못 살겠"

# =================================
# VRAM 사용량 예상 (A100 80GB)
# =================================
# Qwen2.5-32B (FP16): ~65GB
# Whisper large-v3: ~10GB
# Zonos TTS: ~6GB
# 버퍼/KV Cache: ~9GB (배치 4 기준)
# ---------------------------------
# 총 예상: ~80GB (최대 활용)
# =================================
