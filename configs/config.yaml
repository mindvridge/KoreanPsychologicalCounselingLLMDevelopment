# Korean Mental Health Counseling System Configuration
# Production-ready configuration with all components

# Model Configuration
model:
  # provider: "local" (기본값, 실제 LLM 사용)
  # provider: "openai" (OpenAI API 사용)
  # provider: "mock" (테스트용 Mock LLM)
  provider: "openai"  # ChatGPT API 사용
  name: "gpt-5.2"  # OpenAI GPT-5.2 최신 모델
  quantization: "4bit"
  max_memory: "40GB"
  device_map: "auto"
  generation:
    max_length: 300
    temperature: 0.7
    top_p: 0.9
  # OpenAI API 설정
  openai:
    temperature: 0.7
    max_tokens: 500
    top_p: 0.9
    frequency_penalty: 0.0
    presence_penalty: 0.0
    track_cost: true

# Safety and Crisis Detection  
safety:
  crisis_detection_threshold: 0.7
  auto_alert_professionals: false
  log_all_conversations: true

# RAG System
rag:
  knowledge_base_dir: "./knowledge_base"
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "jhgan/ko-sroberta-multitask"
  max_results: 3

# Monitoring
monitoring:
  enabled: true
  retention_days: 30

# Logging (PIPA Compliant)
logging:
  log_dir: "./logs"
  retention_days: 90
  enable_encryption: true
  mask_pii: true

# API
api:
  host: "0.0.0.0"
  port: 8000
  rate_limit: 100
  timeout: 30

# Enhanced Features (신규 모듈 설정)
# =================================

# 응답 검증 설정
validation:
  enabled: true
  min_empathy_score: 0.5
  require_safety_check: true
  max_repetition_ratio: 0.3
  regenerate_on_failure: true

# 대화 상태 관리
conversation_state:
  enabled: true
  auto_phase_progression: true
  track_emotions: true
  identify_concerns: true

# 향상된 RAG 설정
enhanced_rag:
  enabled: true
  query_expansion: true
  relevance_threshold: 0.5
  max_context_length: 1000

# LLM 평가 시스템
evaluation:
  enabled: true
  metrics:
    empathy: 0.30
    safety: 0.25
    therapeutic: 0.20
    cultural: 0.15
    coherence: 0.10
  min_passing_score: 0.6

# A/B 테스트 설정
experiments:
  enabled: true
  default_sample_size: 1000
  significance_level: 0.05

# 모니터링 대시보드
dashboard:
  enabled: true
  update_interval_seconds: 30
  history_retention_hours: 168
  alert_cooldown_minutes: 5

# 파인튜닝 설정
finetuning:
  method: "qlora"
  output_dir: "./outputs/finetuned_model"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
  training:
    epochs: 3
    batch_size: 2
    learning_rate: 0.0002
    gradient_accumulation_steps: 8

# =================================
# 음성 상담 설정 (Voice Counseling)
# =================================

# STT (Speech-to-Text) 설정 - RTX 5060 Ti 최적화
stt:
  enabled: true
  model: "medium"  # RTX 5060 Ti용 (tiny, base, small, medium, large-v3)
  device: "cuda"
  compute_type: "float16"  # RTX 5060 Ti: float16 지원
  language: "ko"
  use_faster_whisper: true  # faster-whisper 사용 (더 빠름)
  vad:
    enabled: true
    aggressiveness: 3  # 0-3 (높을수록 엄격)
    frame_duration_ms: 30

# TTS (Text-to-Speech) 설정
tts:
  enabled: true
  model: "Zyphra/Zonos-v0.1-transformer"
  device: "cuda"
  default_voice_profile: "korean_counselor"
  output_sample_rate: 44100
  # 상담사 음성 설정
  counselor_voice:
    speaking_rate: 0.9  # 약간 느리게 (차분한 톤)
    pitch: -2.0  # 약간 낮게
    default_emotion: "calm"
    emotion_intensity: 0.6

# Voice Cloning 설정
voice_cloning:
  enabled: true
  reference_audio_dir: "./voice_profiles"
  min_reference_duration: 5  # 최소 참조 음성 길이 (초)
  max_reference_duration: 30  # 최대 참조 음성 길이 (초)

# 음성 스트리밍 설정
voice_streaming:
  enabled: true
  chunk_duration: 2.0  # 청크 길이 (초)
  sample_rate: 16000
  channels: 1
  websocket_timeout: 300  # WebSocket 타임아웃 (초)

# 음성 API 설정
voice_api:
  host: "0.0.0.0"
  port: 8001
  cors_origins: ["*"]
  max_audio_size_mb: 50

# =================================
# 배치 처리 설정 (Batch Processing)
# =================================

batch_processing:
  enabled: true
  strategy: "adaptive"  # disabled, fixed, adaptive, priority

  # 기본 배치 설정
  min_batch_size: 1
  max_batch_size: 8
  max_wait_time_ms: 500  # 최대 대기 시간

  # 적응형 배치 설정
  adaptive:
    target_latency_ms: 2000  # 목표 지연 시간
    adjustment_interval: 10  # N 배치마다 크기 조절
    latency_history_size: 100

  # 우선순위별 최대 배치 크기
  priority_max_batch:
    crisis: 1       # 위기 상담 - 즉시 단일 처리
    realtime: 2     # 실시간 음성 - 최소 배치
    premium: 4      # 프리미엄 사용자
    standard: 8     # 일반 사용자
    background: 16  # 백그라운드 작업

  # 우선순위별 최대 대기 시간 (ms)
  priority_max_wait:
    crisis: 0       # 즉시 처리
    realtime: 100
    premium: 300
    standard: 500
    background: 2000

  # 위기 감지 키워드 (자동 우선순위 상승)
  crisis_keywords:
    - "자살"
    - "죽고 싶"
    - "죽을"
    - "목숨"
    - "끝내고 싶"
    - "자해"
    - "손목"
    - "뛰어내리"
    - "살고 싶지 않"
    - "사라지고 싶"
